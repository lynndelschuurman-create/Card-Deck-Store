kind = "mobile"
previewPath = "/"
title = "Reclaim Yourself"
version = "1.0.0"
id = "artifacts/reclaim-yourself"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18361

[services.development]
run = "pnpm --filter @workspace/reclaim-yourself run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reclaim-yourself", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/reclaim-yourself", "run", "serve" ]

[services.env]
PORT = "18361"
BASE_PATH = "/"
